name: Build and Release AI TTS APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Release Files
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/release/app-release.apk release_apks/ai-tts-engine-release.apk
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            cp app/build/outputs/apk/release/app-release.apk "release_apks/ai-tts-engine-${TAG_NAME}.apk"
          fi
          # 自动打包并提取端侧离线运行时拓展组件
          if compgen -G "runtime-addon/build/outputs/apk/release/*.apk" > /dev/null; then
            cp runtime-addon/build/outputs/apk/release/*.apk release_apks/ai-tts-offline-runtime-arm64.apk
          fi

      - name: Upload Artifact to CI Actions
        uses: actions/upload-artifact@v4
        with:
          name: ai-tts-engine-release-apk
          path: release_apks/*

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
