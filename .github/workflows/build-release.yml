name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Copy & Rename APK
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/ai-tts-engine-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/ai-tts-engine-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tts-engine-apk
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/ai-tts-engine-${{ github.ref_name }}.apk
            release_assets/ai-tts-engine-latest.apk
          name: Release ${{ github.ref_name }} (Final Release)
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🤖 AI 全自主开发与终态归档公告 (AI Autonomous & Final Release)
            
            - **全 AI 编写生成**：本项目从架构、底层 TextToSpeechService 系统桥接、协议逆向、网络连接池、双句预加载管线、UI 交互到 README 文档，**全量由 AI 编程助手自主设计、编写并自测构建**。
            - **实测范围说明**：本项目**仅在真实生产环境中针对【小米 MiMo】与【微软 Edge TTS】进行过深度联调与可用性验证**，其余厂商接口按公开规范编写，不保证在所有环境下的完全可用性。
            - **终态归档声明**：本项目功能已全量就绪并经过自动化回归测试，**作为最终交付版本进行开源归档，后续不会有任何功能更新或维护**。
            - **特别致谢**：感谢 **Google DeepMind** 研发的 **Antigravity** 自主编程智能体提供的全生命周期架构与工程实现支持！
