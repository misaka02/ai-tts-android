name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Copy & Rename APK
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/ai-tts-engine-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/ai-tts-engine-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tts-engine-apk
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/ai-tts-engine-${{ github.ref_name }}.apk
            release_assets/ai-tts-engine-latest.apk
          name: Release ${{ github.ref_name }} (Final Release)
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🤖 AI 全自主开发与自动发布公告 (AI Autonomous & Final Release)
            
            - **全 AI 自主开发**：本项目从架构、底层 TextToSpeechService 系统桥接、协议逆向、网络连接池、双句预加载管线到 UI 交互，**全量由 AI 编程助手自主设计、编写并自测验证**。
            - **终态归档声明**：本项目功能已全量就绪且通过全部自动化测试，**作为最终交付版本进行开源归档，后续不会有任何功能更新或维护**。欢迎社区开发者自由 Fork 与二次开发。
            
            ### ✨ 核心功能亮点
            1. **系统级 Android TTS 引擎**：无缝对接「开源阅读 (Legado)」、微信读书、静读天下等应用。
            2. **顶尖大模型矩阵**：全面支持 **小米 MiMo**（导演模式/官方音色）、**Google Gemini 2.5/3.1**（原生多模态/PCM转WAV/30款音色）、**微软 Edge TTS**（免费免Key）、**MiniMax**、**火山引擎豆包**、**硅基流动**、**Fish Audio** 等。
            3. **无缝推流体验**：双句并发滑动窗口预取、全局 HTTP/2 长连接复用、弱网自动重试、PCM 硬件增益调节、Markdown/HTML 智能文本清洗。
